<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Registro</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        form { max-width: 400px; display: flex; flex-direction: column; gap: 15px; }
        label { font-weight: bold; }
        input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        input:invalid { border-color: #ff4d4d; }
        button { padding: 10px; background-color: #5d9e52; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <h1>Registro de Usuario</h1>

    <form action="#" method="POST">
        <label for="username">Nombre de Usuario:</label>
        <input 
            type="text" 
            id="username" 
            name="username" 
            placeholder="Ej: dev_user26" 
            minlength="5" 
            maxlength="15" 
            required>

        <label for="email">Correo Electrónico:</label>
        <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="tu@email.com" 
            required>

        <label for="password">Contraseña:</label>
        <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="Mínimo 8 caracteres" 
            minlength="8" 
            required>

        <label for="dob">Fecha de Nacimiento:</label>
        <input 
            type="date" 
            id="dob" 
            name="dob" 
            min="1920-01-01" 
            max="2026-12-31" 
            required>

        <button type="submit">Registrarse</button>
    </form>

</body>
</html>
